# Local Postgres and mock payer for slices 1 to 3 (spec §9).
name: coverage-check
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: coverage_check
      POSTGRES_DB: coverage_check
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 and later keep data under this path, not .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "coverage_check"]
      interval: 2s
      timeout: 3s
      retries: 30
  mock-payer:
    build: .
    image: coverage-check:dev
    command:
      - uvicorn
      - --factory
      - coverage_check.mock_payer.app:create_app
      - --host=0.0.0.0
      - --port=8000
    environment:
      # MOCK_PAYER_PROFILE=calm turns the injected faults off.
      MOCK_PAYER_PROFILE: /etc/mock-payer/${MOCK_PAYER_PROFILE:-default}.toml
      MOCK_PAYER_DB: /data/mock-payer.sqlite
    ports:
      - "127.0.0.1:${MOCK_PAYER_PORT:-8001}:8000"
    volumes:
      - ./deploy/base/mock-payer:/etc/mock-payer:ro
      - payer-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  payer-data:
