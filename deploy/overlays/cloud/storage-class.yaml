# Where the volume claims of Postgres and the payer's log get their disks: EBS, deleted
# with the claim, so teardown leaves none behind.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: demo-gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
