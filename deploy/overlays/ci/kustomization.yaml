# CI: the same objects, with a payer whose hangs are short enough not to stall the run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coverage-check
resources:
  - ../../base
configMapGenerator:
  - name: mock-payer-profile
    behavior: replace
    files:
      - profile.toml
