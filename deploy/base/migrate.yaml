# Creates or upgrades the schema once, instead of every replica racing to do it.
# A Job's pod template can't be changed, so `make up` deletes the old one first.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {app.kubernetes.io/name: migrate}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-postgres
          image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
          command: [sh, -c, "until pg_isready -h postgres -U coverage_check; do sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: migrate
          image: coverage-check:local
          # Loaded into the nodes by `kind load`. Never pulled: no registry has this name for us.
          imagePullPolicy: Never
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: coverage-check, key: DATABASE_URL}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
