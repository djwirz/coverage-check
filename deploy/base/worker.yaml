# No Service: nothing calls a worker. Any number of them share one limit (ADR 0005).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: worker}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Time between SIGTERM and SIGKILL. Above the worker's own 40 s grace.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: coverage-check:local
          imagePullPolicy: Never
          command: [coverage-check, worker]
          envFrom:
            - configMapRef: {name: worker-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: coverage-check, key: DATABASE_URL}
          # A worker serves no HTTP, so the probes look at files it touches (worker.py).
          startupProbe:
            exec: {command: [test, -f, /tmp/health/alive]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, 'test -n "$(find /tmp/health/ready -mmin -0.5)"']
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            exec:
              command: [sh, -c, 'test -n "$(find /tmp/health/alive -mmin -0.5)"']
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
