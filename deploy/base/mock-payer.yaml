apiVersion: v1
kind: Service
metadata:
  name: mock-payer
spec:
  selector: {app.kubernetes.io/name: mock-payer}
  ports:
    - {name: http, port: 8000}
---
# The payer's request log is the evidence for invariant 1, so it outlives the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mock-payer-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-payer
spec:
  # One only: its limits are counted in memory (ADR 0009).
  replicas: 1
  # Stop the old pod before starting the new one, so two never share the log or the limits.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: mock-payer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mock-payer}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mock-payer
          image: coverage-check:local
          imagePullPolicy: Never
          command:
            - uvicorn
            - --factory
            - coverage_check.mock_payer.app:create_app
            - --host=0.0.0.0
            - --port=8000
          env:
            - {name: MOCK_PAYER_PROFILE, value: /etc/mock-payer/profile.toml}
            - {name: MOCK_PAYER_DB, value: /data/mock-payer.sqlite}
          ports:
            - {containerPort: 8000}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: profile, mountPath: /etc/mock-payer, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: profile
          configMap: {name: mock-payer-profile}
        - name: data
          persistentVolumeClaim: {claimName: mock-payer-data}
