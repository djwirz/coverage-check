# The trace store and its UI: all in one, in memory. Traces go when the pod does.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: otlp-grpc, port: 4317}
    - {name: query, port: 16686}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
          ports:
            - {containerPort: 4317}
            - {containerPort: 16686}
          readinessProbe:
            httpGet: {path: /status, port: 13133}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /status, port: 13133}
            periodSeconds: 10
            initialDelaySeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
