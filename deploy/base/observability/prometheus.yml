# Static targets: the services have fixed names, so Prometheus needs no access to the
# Kubernetes API, and no service account token.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - alerts.yml
scrape_configs:
  # What the database knows (src/coverage_check/metrics.py).
  - job_name: engine
    static_configs:
      - targets: [metrics:9000]
  # What the payer saw (src/coverage_check/mock_payer/metrics.py).
  - job_name: payer
    static_configs:
      - targets: [mock-payer:9100]
