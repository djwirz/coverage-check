# The dashboard. Traces are read in Jaeger's own UI (ADR 0013).
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: http, port: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
          env:
            # Read-only without signing in, reached by port-forward only (`make dashboard`).
            # No login at all, so there is no password to keep or to leave at its default.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION, value: "true"}
            - {name: GF_USERS_VIEWERS_CAN_EDIT, value: "false"}
            # It should fetch and report nothing.
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/coverage-check.json}
          ports:
            - {containerPort: 3000}
          startupProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: logs, mountPath: /var/log/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: providers, configMap: {name: grafana-dashboard-providers}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
        - {name: data, emptyDir: {sizeLimit: 256Mi}}
        - {name: logs, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {}}
