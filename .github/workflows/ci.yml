name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Integration tests start their own Postgres with Testcontainers (the runner has Docker).
      - run: uv run pytest

  image:
    name: Image and mock payer
    runs-on: ubuntu-latest
    env:
      # Compose wants it set to read the file. Postgres isn't started here.
      POSTGRES_PASSWORD: unused
      MOCK_PAYER_PROFILE: calm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --detach --wait --build mock-payer
      - name: One eligibility check against the running container
        run: |
          docker compose exec -T mock-payer coverage-check seed --count 1 \
            | python3 -c 'import json, sys; print(json.dumps(json.load(sys.stdin)["checks"][0]))' \
            | curl --fail-with-body --silent --data @- -H "Idempotency-Key: ci-smoke" \
                http://127.0.0.1:8001/eligibility \
            | tee reply.json
          grep -q '"result":"active"' reply.json
      - if: failure()
        run: docker compose logs mock-payer

  fhir:
    name: FHIR R4 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The validator jar (checked against its sha256) and the FHIR packages it downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/validator_cli-*.jar
            .cache/fhir-packages
          key: fhir-${{ hashFiles('scripts/validate_fhir.sh') }}
      - run: uv sync --locked
      - run: ./scripts/validate_fhir.sh

  cluster:
    name: kind end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The validator jar and FHIR packages, shared with the validation job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/validator_cli-*.jar
            .cache/fhir-packages
          key: fhir-${{ hashFiles('scripts/validate_fhir.sh') }}
      - run: uv sync --locked
      - run: make up OVERLAY=ci
      - run: make e2e
      # A short run: the same disruptions as the full one in chaos.yml, on a smaller batch.
      - run: make chaos CHAOS_COUNT=1500
      - if: failure()
        run: make debug
      - if: always()
        run: make down

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
