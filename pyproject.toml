[project]
name = "coverage-check"
version = "0.1.0"
description = "Bulk insurance coverage checks against a rate-limited, unreliable payer API."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "synthetic-cohort",
    "uvicorn>=0.54.0",
]

[project.scripts]
coverage-check = "coverage_check.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "migrations", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.uv.sources]
synthetic-cohort = { git = "https://github.com/djwirz/synthetic-cohort", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "testcontainers[postgres]>=4.15.0",
]
